<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Star Scoop — Game01</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="hud" id="hud">
      <div class="hud-row">
        <span id="hud-level">关卡 1/3</span>
        <span id="hud-time">时间 70</span>
        <span id="hud-collect">能量 0/8</span>
        <span id="hud-lives">生命 ❤❤❤</span>
      </div>
      <div class="hud-row hud-actions">
        <button type="button" id="btn-pause" aria-label="Pause">暂停</button>
        <button type="button" id="btn-mute" aria-label="Mute">静音</button>
        <button type="button" id="btn-restart" aria-label="Restart">重来</button>
      </div>
    </header>

    <canvas id="game" width="800" height="450" aria-label="Star Scoop game"></canvas>

    <div id="title-screen" class="overlay">
      <h1>Star Scoop</h1>
      <p class="sub">太空收集能量块 · 躲开小行星</p>
      <p class="hint">WASD / 方向键 · 鼠标拖拽 / 触屏滑动</p>
      <button type="button" id="btn-start" class="primary">开始游戏</button>
    </div>

    <div id="pause-overlay" class="overlay hidden" aria-hidden="true">
      <p>已暂停</p>
      <p class="sub">按 Esc / P 或点「继续」</p>
      <button type="button" id="btn-resume" class="primary">继续</button>
    </div>

    <div id="level-overlay" class="overlay hidden" aria-hidden="true">
      <p id="level-msg">过关！</p>
      <button type="button" id="btn-next" class="primary">下一关</button>
    </div>

    <div id="fail-overlay" class="overlay hidden" aria-hidden="true">
      <p id="fail-msg">失败</p>
      <div class="btn-row">
        <button type="button" id="btn-retry" class="primary">重试本关</button>
        <button type="button" id="btn-title">回标题</button>
      </div>
    </div>

    <div id="win-overlay" class="overlay hidden" aria-hidden="true">
      <p>You Win!</p>
      <p class="sub">三关全部通关</p>
      <button type="button" id="btn-again" class="primary">再玩一次</button>
    </div>
  </div>

  <!-- Plain scripts so double-clicking index.html works on Windows -->
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/entities/player.js"></script>
  <script src="src/entities/energy.js"></script>
  <script src="src/entities/asteroid.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
